<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto 2 - Gestor de Tareas</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .header p {
      opacity: 0.9;
      font-size: 14px;
    }

    .input-section {
      padding: 30px;
      background: #f8f9fa;
      border-bottom: 2px solid #e9ecef;
    }

    .input-group {
      display: flex;
      gap: 10px;
    }

    #nuevaTareaInput {
      flex: 1;
      padding: 15px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    #nuevaTareaInput:focus {
      outline: none;
      border-color: #667eea;
    }

    #agregarBtn {
      padding: 15px 30px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }

    #agregarBtn:hover {
      transform: translateY(-2px);
    }

    #agregarBtn:active {
      transform: translateY(0);
    }

    .controls {
      padding: 20px 30px;
      background: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .filters {
      display: flex;
      gap: 10px;
    }

    .filter-btn {
      padding: 8px 16px;
      background: #e9ecef;
      border: 2px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s;
    }

    .filter-btn:hover {
      background: #dee2e6;
    }

    .filter-btn.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-color: #667eea;
    }

    .search-box {
      position: relative;
    }

    #buscarInput {
      padding: 8px 16px;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      width: 200px;
    }

    #buscarInput:focus {
      outline: none;
      border-color: #667eea;
    }

    .tasks-section {
      padding: 30px;
      min-height: 300px;
    }

    .task-item {
      background: white;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 15px;
      transition: all 0.3s;
    }

    .task-item:hover {
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      transform: translateY(-2px);
    }

    .task-item.completed {
      background: #f8f9fa;
      border-color: #28a745;
    }

    .task-checkbox {
      width: 24px;
      height: 24px;
      cursor: pointer;
      accent-color: #667eea;
    }

    .task-content {
      flex: 1;
    }

    .task-title {
      font-size: 16px;
      color: #333;
      font-weight: 500;
    }

    .task-item.completed .task-title {
      text-decoration: line-through;
      color: #6c757d;
    }

    .task-date {
      font-size: 12px;
      color: #6c757d;
      margin-top: 5px;
    }

    .task-actions {
      display: flex;
      gap: 10px;
    }

    .task-btn {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .delete-btn {
      background: #dc3545;
      color: white;
    }

    .delete-btn:hover {
      background: #c82333;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #6c757d;
    }

    .empty-state-icon {
      font-size: 64px;
      margin-bottom: 20px;
      opacity: 0.5;
    }

    .empty-state-text {
      font-size: 18px;
      font-weight: 500;
    }

    .stats {
      padding: 20px 30px;
      background: #f8f9fa;
      border-top: 2px solid #e9ecef;
      display: flex;
      justify-content: space-around;
      text-align: center;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .stat-number {
      font-size: 24px;
      font-weight: 700;
      color: #667eea;
    }

    .stat-label {
      font-size: 12px;
      color: #6c757d;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    @media (max-width: 600px) {
      .controls {
        flex-direction: column;
        align-items: stretch;
      }

      .filters {
        justify-content: center;
      }

      #buscarInput {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>📝 Gestor de Tareas</h1>
      <p>Organiza tu día con closures y JavaScript</p>
    </div>

    <!-- Input Section -->
    <div class="input-section">
      <div class="input-group">
        <input type="text" id="nuevaTareaInput" placeholder="¿Qué necesitas hacer?" autocomplete="off">
        <button id="agregarBtn">+ AGREGAR</button>
      </div>
    </div>

    <!-- Controls (Filters + Search) -->
    <div class="controls">
      <div class="filters">
        <button class="filter-btn active" data-filter="todas">Todas</button>
        <button class="filter-btn" data-filter="pendientes">Pendientes</button>
        <button class="filter-btn" data-filter="completadas">Completadas</button>
      </div>
      <div class="search-box">
        <input type="text" id="buscarInput" placeholder="Buscar tareas..." autocomplete="off">
      </div>
    </div>

    <!-- Tasks List -->
    <div class="tasks-section" id="tasksContainer">
      <!-- Las tareas se renderizan aquí dinámicamente -->
      <div id="listaTareas"></div>
      <div class="empty-state">
        <div class="empty-state-icon">📭</div>
        <div class="empty-state-text">No hay tareas. ¡Agrega una para empezar!</div>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat-item">
        <div class="stat-number" id="statTotal">0</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" id="statCompletadas">0</div>
        <div class="stat-label">Completadas</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" id="statPendientes">0</div>
        <div class="stat-label">Pendientes</div>
      </div>
    </div>
  </div>

  <!-- Tu código JavaScript va aquí -->
  <script src="app.js"></script>
</body>

</html>
